method: bayes  # or random if you want to keep it simple
metric:
  name: val_loss
  goal: minimize

parameters:
  learning_rate:
    min: 1e-6
    max: 5e-4
    distribution: log_uniform_values

  hidden_size:
    values: [32, 64, 96]

  dropout:
    min: 0.05
    max: 0.15
    distribution: uniform

  hidden_continuous_size:
    values: [4, 8]

  attention_head_size:
    values: [1, 2]  # Only used for TFT

  weight_decay:
    min: 1e-6
    max: 5e-4
    distribution: log_uniform_values

  loss:
    values: ['QuantileLoss']  # Focused sweep

  model:
    values: ['LSTM', 'TemporalFusionTransformer']

  quantiles:
    values: [[0.1, 0.5, 0.9], [0.2, 0.5, 0.8]]

  epochs:
    values: [50]

command: ["python", "train.py"]
